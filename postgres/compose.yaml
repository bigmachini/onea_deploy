name: cashkoom-db

services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    stop_grace_period: 1m
    shm_size: 256mb
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set the PostgreSQL administrator password in .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - wal_level=replica
      - -c
      - max_slot_wal_keep_size=10GB
    networks:
      default:
      replication:
        aliases: [cashkoom-primary]
    ports:
      - '${DB_BIND_IP:?Set DB_BIND_IP in .env to the database server VPN IP}:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  pgadmin:
    image: dpage/pgadmin4:9.17
    networks: [default, replication]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?Set the pgAdmin login email in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Set the pgAdmin login password in .env}
      PGADMIN_DISABLE_POSTFIX: '1'
    ports:
      - '${DB_BIND_IP:?Set DB_BIND_IP in .env to the database server VPN IP}:5050:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  postgres_data:
  pgadmin_data:

networks:
  replication:
    external: true
    name: cashkoom-replication
