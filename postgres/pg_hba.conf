# Local container administration and backups. Docker access is privileged access.
local all postgres trust

# pgAdmin connects over this Compose project's internal Docker network.
host all postgres samenet scram-sha-256

# Reporting replica on the shared Docker network (same-server deployment).
host replication replicator samenet scram-sha-256

# EXAMPLES: replace these with the actual application servers' VPN addresses.
# Database(s)     Role     Source application server
host cashkoom  odoo     100.104.156.52/32  scram-sha-256
host onea_hes         django      100.104.156.52/32  scram-sha-256
host onea_mobile         django      100.104.156.52/32  scram-sha-256
host onea_sms         django      100.104.156.52/32  scram-sha-256



# All other connections are denied. Network encryption is supplied by the VPN.
host all all 0.0.0.0/0 reject
host all all ::/0 reject
