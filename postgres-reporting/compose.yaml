name: cashkoom-reporting

services:
  reporting:
    image: postgres:16-bookworm
    restart: unless-stopped
    stop_grace_period: 1m
    cpus: ${REPORTING_CPUS:-2}
    mem_limit: ${REPORTING_MEMORY:-2g}
    shm_size: 256mb
    environment:
      PRIMARY_HOST: ${PRIMARY_HOST:-cashkoom-primary}
      PGDATA: /var/lib/postgresql/data
    entrypoint: [bash, /replica-entrypoint.sh]
    command:
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - hot_standby=on
    ports:
      - '${DB_BIND_IP:?Set DB_BIND_IP in .env to this server VPN IP}:5433:5432'
    volumes:
      - reporting_data:/var/lib/postgresql/data
      - ./replica-entrypoint.sh:/replica-entrypoint.sh:ro
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./.pgpass:/config/pgpass:ro
    networks:
      replication:
        aliases: [cashkoom-reporting]
    healthcheck:
      test: ['CMD-SHELL', 'test "$$(psql -U postgres -d postgres -Atqc "SELECT pg_is_in_recovery()")" = t']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 1m
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  reporting_data:

networks:
  replication:
    external: true
    name: cashkoom-replication
