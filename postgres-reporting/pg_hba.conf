local all postgres trust

# pgAdmin on the shared Docker network.
host all postgres samenet scram-sha-256

# Reporting connections from local pgAdmin/tools, or the remote BI server.
host all reporting samenet scram-sha-256
# EXAMPLE: replace with your actual reporting server's VPN address.
host all reporting 10.50.0.40/32 scram-sha-256

host all all 0.0.0.0/0 reject
host all all ::/0 reject
